name: Lunar Hosting CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lunar-hosting-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Check PHP syntax
        run: |
          find app bootstrap config database extensions routes tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run test suite
        run: vendor/bin/phpunit --testsuite "Lunar Hosting"
