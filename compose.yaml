services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LUNAR_AUTO_MIGRATE: ${LUNAR_AUTO_MIGRATE:-true}
      PAYMENTER_SKIP_DEFAULT: ${PAYMENTER_SKIP_DEFAULT:-true}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_var:/app/var
    restart: unless-stopped
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-lunar_hosting}
      MARIADB_USER: ${DB_USERNAME:-lunar_hosting}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  mariadb_data:
  redis_data:
  app_storage:
  app_var:
